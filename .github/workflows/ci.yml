name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: PostgreSQL smoke and behavior tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_DB: service_desk_analytics
      POSTGRES_USER: service_desk
      POSTGRES_PASSWORD: ci-local-only-password
      POSTGRES_PORT: "5434"
      SEED_SCALE: "0.002"
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up --detach

      - name: Wait for PostgreSQL
        run: bash scripts/wait-for-postgres.sh

      - name: Apply migrations twice
        run: |
          bash scripts/migrate.sh
          bash scripts/migrate.sh

      - name: Generate deterministic CI data
        run: bash scripts/seed.sh

      - name: Create analytical indexes and views
        run: |
          bash scripts/apply-optimizations.sh
          bash scripts/refresh-materialized-views.sh

      - name: Run schema smoke tests
        run: bash scripts/smoke-test.sh

      - name: Execute all analytical queries
        run: bash scripts/query-smoke.sh

      - name: Exercise backup and restore
        run: bash scripts/backup-restore-demo.sh

      - name: Reproduce and prevent a deadlock
        run: bash scripts/deadlock-demo.sh

      - name: Collect diagnostics after failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color database > postgres-ci.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: postgres-ci-diagnostics
          path: postgres-ci.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the environment
        if: always()
        run: docker compose down --volumes --remove-orphans
